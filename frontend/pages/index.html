<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CollabDocs — Real-time Collaborative Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/editor.css" />
  <style>
    /* Auth page */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }
    .auth-logo p { color: var(--text2); margin-top: 4px; }
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      background: var(--bg3);
      border-radius: 8px;
      padding: 4px;
    }
    .auth-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .auth-tab.active { background: var(--bg2); color: var(--text); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text2); }
  </style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="auth-page" class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>⚡ CollabDocs</h1>
      <p>Real-time collaborative document editing</p>
    </div>
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Sign in</button>
        <button class="auth-tab" onclick="switchTab('register')">Create account</button>
      </div>

      <!-- Login -->
      <div id="login-form" class="auth-form active">
        <form onsubmit="event.preventDefault(); handleLogin()">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Sign in</button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="#" onclick="switchTab('register')">Create one</a>
        </div>
      </div>

      <!-- Register -->
      <div id="register-form" class="auth-form">
        <form onsubmit="event.preventDefault(); handleRegister()">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="yourname" autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-pass" placeholder="min 8 chars, include a number" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Create account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-page" style="display:none">
  <nav class="nav-bar">
    <span class="nav-logo">⚡ CollabDocs</span>
    <div class="nav-user">
      <span id="nav-username"></span>
      <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Sign out</button>
    </div>
  </nav>

  <div class="dashboard-layout">
    <div class="dashboard-header">
      <h1>My Documents</h1>
      <button class="btn btn-primary" onclick="createDocument()">
        + New Document
      </button>
    </div>
    <div id="docs-empty" class="empty-state" style="display:none">
      <h3>No documents yet</h3>
      <p style="margin-bottom:16px">Create your first document to get started</p>
      <button class="btn btn-primary" onclick="createDocument()">+ New Document</button>
    </div>
    <div id="doc-grid" class="doc-grid"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
